services:
  forex-worker:
    build: .
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - FOREX_TF=${FOREX_TF:-h1}
      - FOREX_PAIRS=${FOREX_PAIRS:-eurusd gbpusd usdjpy usdchf audusd usdcad nzdusd eurgbp eurjpy gbpjpy xauusd}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - EVO_URL=${EVO_URL:-https://evo.biggrowth.io}
      - EVO_INSTANCE=${EVO_INSTANCE:-BIG GROWTH}
      - EVO_KEY=${EVO_KEY:-}
      - SIGNAL_WA_NUMBER=${SIGNAL_WA_NUMBER:-}
      - SIGNAL_CONFIG=${SIGNAL_CONFIG:-EURUSD:rsi_trend_filter,GBPUSD:keltner_breakout}
    volumes:
      - forex-data:/data
      - lab-sandbox:/sandbox:ro
    networks:
      - coolify
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2g
    healthcheck:
      test: ["CMD", "test", "-d", "/data"]
      interval: 60s
      timeout: 5s
      retries: 3

  lab-dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile.dashboard
    restart: unless-stopped
    environment:
      - DASH_USER=${DASH_USER}
      - DASH_PASS=${DASH_PASS}
    volumes:
      - forex-data:/data:ro
    networks:
      - coolify
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64m

  lab-api:
    build:
      context: .
      dockerfile: intake/Dockerfile.intake
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LAB_LLM_MODEL=${LAB_LLM_MODEL:-claude-sonnet-5-5}
      - LAB_DAILY_LIMIT=${LAB_DAILY_LIMIT:-20}
    volumes:
      - lab-sandbox:/sandbox
    networks:
      - coolify
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 60s
      timeout: 5s

  lab-runner:
    build:
      context: .
      dockerfile: intake/Dockerfile.intake
    command: ["python", "runner.py"]
    restart: unless-stopped
    networks:
      - lab-isolated
    volumes:
      - forex-data:/data:ro
      - lab-sandbox:/sandbox
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 3g }

volumes:
  forex-data:
  lab-sandbox:

networks:
  coolify:
    external: true
  lab-isolated:
    internal: true
