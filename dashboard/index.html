<title>مختبر الاستراتيجيات</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: lab instrument panel — sticky bar + tabs, summary first, then evidence. RTL. */
:root{
  color-scheme:light;
  --page:#f4f5f6; --surface:#fcfcfb; --sunk:#eef0f2; --line:#e1e3e6; --axis:#c3c4c7;
  --ink:#0d1117; --ink-2:#4b5260; --muted:#838895;
  --accent:#1c5cab; --accent-soft:#e3edfa; --series:#2a78d6; --series-wash:rgba(42,120,214,.10);
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --good-ink:#006300; --crit-ink:#b42f2f;
  --d-n3:#b42f2f; --d-n2:#e97573; --d-n1:#f6c7c6; --d-0:#ecebe7; --d-p1:#b7d3f6; --d-p2:#5598e7; --d-p3:#184f95;
  --ring:rgba(13,17,23,.10); --shadow:0 1px 2px rgba(13,17,23,.06),0 4px 16px rgba(13,17,23,.04);
  --sans:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --page:#0e1013; --surface:#16191d; --sunk:#1d2126; --line:#2a2e34; --axis:#3a3f46;
  --ink:#f3f4f6; --ink-2:#c1c5cc; --muted:#8a909a;
  --accent:#6da7ec; --accent-soft:#16263b; --series:#3987e5; --series-wash:rgba(57,135,229,.14);
  --good-ink:#2fc22f; --crit-ink:#ef7a7a;
  --d-n3:#d05050; --d-n2:#9a3a3a; --d-n1:#4d2a2a; --d-0:#2c2f33; --d-p1:#1f3a5e; --d-p2:#2a6dc0; --d-p3:#7fb2f0;
  --ring:rgba(255,255,255,.10); --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0e1013; --surface:#16191d; --sunk:#1d2126; --line:#2a2e34; --axis:#3a3f46;
  --ink:#f3f4f6; --ink-2:#c1c5cc; --muted:#8a909a;
  --accent:#6da7ec; --accent-soft:#16263b; --series:#3987e5; --series-wash:rgba(57,135,229,.14);
  --good-ink:#2fc22f; --crit-ink:#ef7a7a;
  --d-n3:#d05050; --d-n2:#9a3a3a; --d-n1:#4d2a2a; --d-0:#2c2f33; --d-p1:#1f3a5e; --d-p2:#2a6dc0; --d-p3:#7fb2f0;
  --ring:rgba(255,255,255,.10); --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{direction:rtl}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
.num,.mono{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
a{color:var(--accent)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--page) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1320px;margin:0 auto;padding:12px 20px 0;display:grid;gap:10px}
.bar-top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--page);display:grid;place-items:center;flex:none}
.brand-mark svg{width:20px;height:20px}
.brand h1{font-size:18px;line-height:1.2}
.brand p{margin:0;color:var(--muted);font-size:12px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0;max-width:100%}
.runchip{max-width:100%;min-width:0}
.runchip select{min-width:0;max-width:min(360px,62vw);text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--ink-2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;max-width:100%}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;padding:10px 14px;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}

main{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:20px 60px;display:grid;gap:20px}
.sample{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);color:var(--ink);padding:10px 14px;border-radius:var(--r);font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15px}
.card .sub{color:var(--muted);font-size:12px;margin:2px 0 0}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px 16px;margin-bottom:14px}
.eyebrow{font-size:11px;letter-spacing:.04em;color:var(--muted);font-weight:500}

/* hero + tiles */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr);gap:16px}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.hero-fig{display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.hero-num{font-size:56px;line-height:1;font-weight:600;letter-spacing:-.02em}
.hero-num small{font-size:22px;color:var(--muted);font-weight:500}
.hero p{margin:0;color:var(--ink-2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:4px;align-content:start;min-width:0}
.tile .lbl{font-size:12px;color:var(--muted)}
.tile .val{font-size:24px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.tile .note{font-size:12px;color:var(--ink-2)}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);white-space:nowrap;color:var(--ink)}
.pill svg{width:14px;height:14px;flex:none}
.big-pill{font-size:14px;padding:4px 14px 4px 10px}
.big-pill svg{width:18px;height:18px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.linkbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.linkbtn:hover{color:var(--ink);border-color:var(--axis)}

/* heatmap */
.scroll{overflow-x:auto;min-width:0}
.heat{border-collapse:separate;border-spacing:2px;font-size:12px}
.heat th{font-weight:500;color:var(--ink-2);padding:4px 8px;white-space:nowrap}
.heat th.row{text-align:right;position:sticky;right:0;background:var(--surface);z-index:1}
.heat td{padding:0}
.cell{direction:ltr;width:66px;height:42px;border:0;border-radius:5px;cursor:pointer;display:grid;place-items:center;font:500 12px var(--mono);position:relative;transition:transform .08s}
.cell:hover{transform:scale(1.06);z-index:2}
.cell[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.cell .ok{position:absolute;top:3px;left:4px;width:12px;height:12px}
.scale{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:12px;color:var(--ink-2);margin-top:12px}
.scale span{display:inline-flex;align-items:center;gap:5px}
.sw{width:18px;height:12px;border-radius:3px;display:inline-block}

/* detail */
.detail-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.detail-title{display:grid;gap:4px}
.detail-title h2{font-size:20px}
.scorebox{display:flex;align-items:center;gap:14px}
.gauge{width:84px;height:84px;flex:none}
.score-lbl{display:grid;gap:2px}
.score-lbl b{font-size:15px}
.score-lbl span{font-size:12px;color:var(--muted)}
.checks{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.checks li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--sunk)}
.checks li svg{width:18px;height:18px}
.checks .thr{font-size:12px;color:var(--muted)}
.checks .v{font-weight:600}
.parts{display:grid;gap:9px}
.part{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:12px}
.part .track{height:8px;background:var(--accent-soft);border-radius:4px;overflow:hidden}
.part .fill{height:100%;background:var(--series);border-radius:4px}
.part .pv{text-align:left;color:var(--ink-2)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr));gap:10px}
.metric{padding:10px 12px;border:1px solid var(--line);border-radius:8px;display:grid;gap:2px}
.metric .lbl{font-size:11px;color:var(--muted)}
.metric .val{font-size:17px;font-weight:600}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:6px 10px;font-size:12px;white-space:nowrap;z-index:5;display:none}
.tip b{font:600 13px var(--mono);display:block}
.tip span{color:var(--muted)}

/* tables */
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{font-weight:500;color:var(--muted);font-size:12px;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t td.n{font-family:var(--mono);direction:ltr;text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover{background:var(--sunk)}
.badge{font:500 11px var(--mono);padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.passdots{display:inline-flex;gap:3px;direction:ltr}
.passdots i{width:8px;height:8px;border-radius:2px;background:var(--line);display:block}
.passdots i.on{background:var(--good)}
.empty{color:var(--muted);font-size:13px;padding:18px;text-align:center;background:var(--sunk);border-radius:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.stack{display:flex;height:16px;border-radius:4px;overflow:hidden;gap:2px;background:var(--surface);min-width:60px}
.stack i{display:block;height:100%}
.meter{height:10px;background:var(--accent-soft);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:5px}
.note-box{border-inline-start:3px solid var(--warn);background:var(--sunk);padding:10px 14px;border-radius:6px;font-size:13px;color:var(--ink-2)}
.funnel{display:grid;gap:8px}
.frow{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 70px;gap:12px;align-items:center;font-size:13px}
.frow .fbar{height:22px;border-radius:0 4px 4px 0;border:0;background:var(--d-p2);position:static;backdrop-filter:none;min-width:3px}
.frow .fv{font-family:var(--mono);text-align:left;font-weight:500}
.lb{display:grid;gap:8px}
.lb-row{display:grid;grid-template-columns:minmax(0,1.4fr) auto minmax(0,1fr) 54px;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface);text-align:start}
.lb-row:hover{border-color:var(--axis)}
.lb-row .nm{font-weight:600;overflow-wrap:anywhere}
.lb-row .fam{font-size:11px;color:var(--muted)}
.spec{display:grid;gap:6px;font-size:13px}
.spec div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.spec div span:first-child{color:var(--muted)}

/* upload */
.drop{border:1.5px dashed var(--axis);border-radius:var(--r);padding:26px 18px;display:grid;place-items:center;gap:8px;text-align:center;background:var(--sunk);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:34px;height:34px;color:var(--accent)}
.drop b{font-size:15px}
.drop .sub{max-width:52ch}
.drop .picked{font-family:var(--mono);font-size:13px;color:var(--ink)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.field{display:grid;gap:4px;font-size:12px;color:var(--ink-2);min-width:0}
.field input,.field select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;color:var(--ink);min-width:0;width:100%}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-weight:600;cursor:pointer;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:root[data-theme="dark"] .btn{color:#0e1013}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0e1013}}
.routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.route{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:4px;font-size:13px;align-content:start}
.route b{font-size:13px}
.route .ext{font-family:var(--mono);font-size:11px;color:var(--muted)}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 2px;padding:0;list-style:none}
.steps li{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);padding:3px 8px 3px 6px;border-radius:999px;background:var(--sunk)}
.steps li i{width:7px;height:7px;border-radius:50%;background:var(--axis);display:block}
.steps li.done{color:var(--ink-2)} .steps li.done i{background:var(--good)}
.steps li.now{color:var(--ink);font-weight:600;background:var(--accent-soft)} .steps li.now i{background:var(--accent);animation:pulse 1.2s infinite}
.steps li.bad{color:var(--crit-ink);font-weight:600} .steps li.bad i{background:var(--crit)}
@keyframes pulse{50%{opacity:.3}}
.sub-card{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;background:var(--surface)}
.sub-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.sub-head .fn{font-weight:600;overflow-wrap:anywhere}
.rules{display:grid;gap:6px}
.rules div{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr);gap:10px;font-size:13px;align-items:baseline}
.rules code{font-family:var(--mono);font-size:12px;background:var(--sunk);padding:3px 8px;border-radius:5px;direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere;text-align:left}
.amb{margin:0;padding-inline-start:18px;font-size:13px;color:var(--ink-2)}
.err{color:var(--crit-ink);font-size:13px;background:var(--sunk);padding:8px 12px;border-radius:6px;border-inline-start:3px solid var(--crit)}
.toast{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--accent-soft)}
.legend svg,.sub-card .legend svg{width:16px;height:16px;flex:none}
.sub-card,.sub-card>*{min-width:0;max-width:100%}
.rules code{word-break:break-word}
.drop{min-width:0;max-width:100%}
[hidden]{display:none!important}
@media (max-width:560px){
  .hero-num{font-size:44px}
  .part{grid-template-columns:minmax(0,1fr) 46px}.part .track{grid-column:1/-1;order:3}
  .lb-row{grid-template-columns:minmax(0,1fr) auto}.lb-row .mt,.lb-row .sc{display:none}
  .frow{grid-template-columns:minmax(0,1fr) 60px}.frow .fbar{grid-column:1/-1;order:3}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="bar">
  <div class="bar-in">
    <div class="bar-top">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6.5L4.8 18.2A1.9 1.9 0 0 0 6.4 21h11.2a1.9 1.9 0 0 0 1.6-2.8L14 9.5V3"/><path d="M7.5 15h9"/></svg></div>
        <div><h1>مختبر الاستراتيجيات</h1><p>Walk-forward · خارج العينة · بعد التكاليف</p></div>
      </div>
      <div class="controls">
        <span class="chip" id="fresh"><i class="dot" style="background:var(--muted)"></i><span>…</span></span>
        <label class="chip runchip" for="runSel" style="padding:2px 4px 2px 10px">تشغيل المختبر
          <select id="runSel" aria-label="اختر تشغيل المختبر"></select></label>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="الأقسام">
      <button role="tab" id="t-overview" aria-selected="true" data-tab="overview">نظرة عامة</button>
      <button role="tab" id="t-lab" aria-selected="false" data-tab="lab">الاستراتيجيات</button>
      <button role="tab" id="t-upload" aria-selected="false" data-tab="upload">إضافة استراتيجية</button>
      <button role="tab" id="t-research" aria-selected="false" data-tab="research">البحث والخزنة</button>
      <button role="tab" id="t-imports" aria-selected="false" data-tab="imports">الاستيراد</button>
      <button role="tab" id="t-data" aria-selected="false" data-tab="data">البيانات</button>
    </nav>
  </div>
</header>

<main id="app">
  <div class="empty" id="loading">جارٍ تحميل بيانات المختبر…</div>
</main>
<div class="tip" id="tip" role="tooltip"></div>

<script>
"use strict";
/* ---------------------------------------------------------------- helpers */
const $ = (s, r = document) => r.querySelector(s);
const SVGNS = "http://www.w3.org/2000/svg";
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k === "style") e.setAttribute("style", v);
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}
function s(tag, attrs = {}, ...kids) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) e.setAttribute(k, v);
  for (const c of kids.flat()) if (c != null) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}
const num = (v, d = 2) => v == null || isNaN(v) ? "—" : Number(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const int = v => v == null ? "—" : Number(v).toLocaleString("en-US");
const pct = (v, d = 1) => v == null ? "—" : (v > 0 ? "+" : "") + num(v, d) + "%";
const N = (txt) => h("span", { class: "num" }, txt);
const fmtDate = iso => { if (!iso) return "—"; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleDateString("ar-EG-u-nu-latn", { year: "numeric", month: "short", day: "numeric" }); };

function inkFor(varName) {
  const c = getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  const m = c.match(/^#(..)(..)(..)$/); if (!m) return "var(--ink)";

/* ---------------------------------------------------------------- charts */
function equityChart(series, { h: H = 230 } = {}) {
  const wrap = h("div", { class: "chart" });
  if (!series || series.length < 2) return h("div", { class: "empty" }, "لا يوجد منحنى رأس مال لهذا الاختيار.");
  const W = 720, m = { t: 12, r: 52, b: 26, l: 12 };
  const xs = series.map(p => new Date(p[0]).getTime()), ys = series.map(p => p[1]);
  let y0 = Math.min(1, ...ys), y1 = Math.max(1, ...ys); const pad = (y1 - y0) * .08 || .05; y0 -= pad; y1 += pad;
  const X = t => m.l + (t - xs[0]) / (xs[xs.length - 1] - xs[0]) * (W - m.l - m.r);
  const Y = v => m.t + (1 - (v - y0) / (y1 - y0)) * (H - m.t - m.b);
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "منحنى رأس المال خارج العينة" });
  svg.style.direction = "ltr";
  // y grid: 4 clean ticks
  const step = niceStep((y1 - y0) / 4);
  for (let v = Math.ceil(y0 / step) * step; v <= y1; v += step) {
    svg.append(s("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: "var(--line)", "stroke-width": 1 }));
    svg.append(s("text", { x: W - m.r + 6, y: Y(v) + 4, "font-size": 11, fill: "var(--muted)", "font-family": "var(--mono)" }, pct((v - 1) * 100, 0)));
  }
  svg.append(s("line", { x1: m.l, x2: W - m.r, y1: Y(1), y2: Y(1), stroke: "var(--axis)", "stroke-width": 1 }));
  // x year ticks
  const y0d = new Date(xs[0]).getUTCFullYear(), y1d = new Date(xs[xs.length - 1]).getUTCFullYear();
  for (let y = y0d + 1; y <= y1d; y++) {
    const t = Date.UTC(y, 0, 1), x = X(t);
    svg.append(s("text", { x, y: H - 6, "font-size": 11, fill: "var(--muted)", "text-anchor": "middle", "font-family": "var(--mono)" }, String(y)));
  }
  const pts = series.map((p, i) => `${X(xs[i]).toFixed(1)},${Y(ys[i]).toFixed(1)}`);
  svg.append(s("path", { d: `M${pts[0]} L${pts.join(" L")} L${X(xs.at(-1))},${Y(y0)} L${X(xs[0])},${Y(y0)}Z`, fill: "var(--series-wash)" }));
  svg.append(s("path", { d: `M${pts.join(" L")}`, fill: "none", stroke: "var(--series)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
  const ex = X(xs.at(-1)), ey = Y(ys.at(-1));
  svg.append(s("circle", { cx: ex, cy: ey, r: 4.5, fill: "var(--series)", stroke: "var(--surface)", "stroke-width": 2 }));
  const cross = s("line", { y1: m.t, y2: H - m.b, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" });
  const dotH = s("circle", { r: 4.5, fill: "var(--series)", stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" });
  svg.append(cross, dotH);
  const hit = s("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent", tabindex: 0 });
  const onMove = evt => {
    const r = svg.getBoundingClientRect(), px = (evt.clientX - r.left) / r.width * W;
    let i = 0, best = Infinity; xs.forEach((t, j) => { const d = Math.abs(X(t) - px); if (d < best) { best = d; i = j; } });
    cross.setAttribute("x1", X(xs[i])); cross.setAttribute("x2", X(xs[i])); cross.setAttribute("visibility", "visible");
    dotH.setAttribute("cx", X(xs[i])); dotH.setAttribute("cy", Y(ys[i])); dotH.setAttribute("visibility", "visible");
    showTip(evt, [h("b", {}, pct((ys[i] - 1) * 100)), h("span", {}, fmtDate(series[i][0]))]);
  };
  hit.addEventListener("pointermove", onMove);
  hit.addEventListener("pointerleave", () => { hideTip(); cross.setAttribute("visibility", "hidden"); dotH.setAttribute("visibility", "hidden"); });
  svg.append(hit);
  wrap.append(svg);
  wrap.append(h("div", { class: "legend", style: "margin-top:6px" },
    h("span", {}, "العائد التراكمي خارج العينة، بدون رافعة: ", N(pct((ys.at(-1) - 1) * 100)))));
  return wrap;
}
function niceStep(raw) { const p = 10 ** Math.floor(Math.log10(raw || 1)); const n = raw / p; return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p; }

function hbars(items, { thr = null, thrLabel = "", fmt = v => num(v), max = null } = {}) {
  // items: [{label, value}] — one measure, one color; threshold drawn as a hairline
  const W = 560, rowH = 34, m = { l: 60, r: 130 }, H = items.length * rowH + 22;
  const vals = items.map(i => i.value ?? 0);
  const lo = Math.min(0, ...vals, thr ?? 0), hi = max ?? Math.max(0.0001, ...vals, thr ?? 0) * 1.1;
  const X = v => m.r + (v - lo) / (hi - lo) * (W - m.l - m.r);   // RTL-agnostic: bars grow left→right in a LTR svg
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "مقارنة" });
  svg.style.direction = "ltr";
  items.forEach((it, i) => {
    const y = 6 + i * rowH, v = it.value ?? 0, x0 = X(0), x1 = X(v);
    svg.append(s("text", { x: m.r - 10, y: y + 17, "text-anchor": "end", "font-size": 12, fill: "var(--ink-2)", "font-family": "var(--sans)" }, it.label));
    svg.append(s("rect", { x: Math.min(x0, x1), y: y + 5, width: Math.max(2, Math.abs(x1 - x0)), height: 18, rx: 4, fill: it.color || "var(--series)" }));
    svg.append(s("text", { x: Math.max(x0, x1) + 6, y: y + 18, "font-size": 12, fill: "var(--ink)", "font-family": "var(--mono)" }, fmt(it.value)));
  });
  svg.append(s("line", { x1: X(0), x2: X(0), y1: 4, y2: H - 18, stroke: "var(--axis)", "stroke-width": 1 }));
  if (thr != null) {
    svg.append(s("line", { x1: X(thr), x2: X(thr), y1: 2, y2: H - 18, stroke: "var(--ink)", "stroke-width": 1 }));
    svg.append(s("text", { x: X(thr), y: H - 4, "text-anchor": "middle", "font-size": 11, fill: "var(--ink-2)", "font-family": "var(--sans)" }, thrLabel));
  }
  return h("div", { class: "chart" }, svg);
}

function gauge(score) {

function histogram(bins, thr) {
  const W = 640, H = 220, m = { t: 14, r: 16, b: 34, l: 40 };
  const max = Math.max(1, ...bins.map(b => b.n)), bw = (W - m.l - m.r) / bins.length;
  const Y = n => m.t + (1 - n / max) * (H - m.t - m.b);
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "توزيع قوة الدليل t" });
  svg.style.direction = "ltr";
  const step = niceStep(max / 4);
  for (let v = 0; v <= max; v += step) {
    svg.append(s("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: "var(--line)" }));
    svg.append(s("text", { x: m.l - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)", "font-family": "var(--mono)" }, int(v)));
  }
  const thrIdx = bins.findIndex(b => b.lo >= thr);
  if (thrIdx > 0) {
    const x = m.l + thrIdx * bw;
    svg.append(s("rect", { x: m.l, y: m.t, width: x - m.l, height: H - m.t - m.b, fill: "var(--sunk)" }));
    svg.append(s("text", { x: x - 6, y: m.t + 14, "text-anchor": "end", "font-size": 12, fill: "var(--ink-2)", "font-family": "var(--sans)" }, "منطقة الصدفة المحتملة"));
    svg.append(s("line", { x1: x, x2: x, y1: m.t - 4, y2: H - m.b, stroke: "var(--ink)", "stroke-width": 1 }));
    svg.append(s("text", { x: x + 6, y: m.t + 14, "font-size": 12, fill: "var(--ink)", "font-family": "var(--sans)" }, `عتبة القبول t ≥ ${thr}`));
  }
  bins.forEach((b, i) => {
    const x = m.l + i * bw + 2, w = Math.min(24, bw - 4), cx = m.l + i * bw + bw / 2;
    const above = b.lo >= thr;
    const r = s("rect", { x: cx - w / 2, y: Y(b.n), width: w, height: Math.max(0, H - m.b - Y(b.n)), rx: 3, fill: above ? "var(--series)" : "var(--axis)" });
    const g = s("g", { tabindex: 0 }, s("rect", { x: m.l + i * bw, y: m.t, width: bw, height: H - m.t - m.b, fill: "transparent" }), r);
    const lab = b.hi == null ? `≥ ${b.lo}` : `${b.lo}–${b.hi}`;
    g.addEventListener("pointermove", e => showTip(e, [h("b", {}, int(b.n) + " فرضية"), h("span", {}, "|t| " + lab)]));
    g.addEventListener("pointerleave", hideTip);
    svg.append(g);
    svg.append(s("text", { x: cx, y: H - m.b + 16, "text-anchor": "middle", "font-size": 10, fill: "var(--muted)", "font-family": "var(--mono)" }, String(b.lo)));
  });
  svg.append(s("text", { x: (W + m.l) / 2, y: H - 2, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)", "font-family": "var(--sans)" }, "|t| — قوة الدليل الإحصائي"));
  return h("div", { class: "chart" }, svg);
}

/* ---------------------------------------------------------------- views */
function viewOverview() {
  const run = currentRun(), rows = run ? run.rows.filter(r => r.verdict !== "NO_DATA") : [];
  const passed = rows.filter(r => r.verdict === "PASS");
  const R = D.research, I = D.imports;
  const best = [...rows].sort((a, b) => (b.score ?? 0) - (a.score ?? 0))[0];
  const gap = run?.meta?.avg_is_minus_wf_sharpe;
  const pending = R.pending.length, vpass = R.vault_history.filter(v => v.event === "VAULT_PASS").length;

  const hero = h("div", { class: "hero" },
    h("section", { class: "card hero-fig" },
      h("div", {}, h("div", { class: "eyebrow" }, "آخر تشغيل كامل للمختبر"),
        h("div", { class: "hero-num", style: "margin-top:10px" }, N(String(passed.length)), " ", h("small", {}, "من ", N(String(rows.length)))),
        h("p", { style: "margin-top:8px" }, "توليفة (استراتيجية × زوج) اجتازت كل معايير walk-forward خارج العينة.")),
      h("div", { class: "meter", role: "img", "aria-label": "نسبة الاجتياز" }, h("i", { style: `width:${rows.length ? passed.length / rows.length * 100 : 0}%;background:var(--good)` }))),
    h("div", { class: "tiles" },
      tile("أقوى نتيجة", best ? h("span", {}, stratName(best.strategy)) : "—", best ? h("span", {}, N(best.pair), " · مؤشر القوة ", N(String(best.score))) : null),
      tile("فجوة التفاؤل (IS − WF)", N(num(gap)), gap == null ? null : gap > 1 ? "مرتفعة: overfitting واضح" : gap > 0.5 ? "متوسطة" : "منخفضة: النتائج متسقة"),
      tile("مرشّحات بانتظار موافقتك", N(String(pending)), pending ? "لاختبار الخزنة المقفلة" : "لا شيء معلّق"),
      tile("فتحات الخزنة", h("span", {}, N(`${R.vault.unlocks}/${R.vault.limit}`)), `${vpass} اجتازت · ${R.vault.unlocks - vpass} فشلت`),
      tile("استراتيجيات مستوردة مختبرة", N(String(I.lifetime_tested)), `${I.items.filter(i => i.verdict === "SURVIVOR").length} ناجية · ${I.items.filter(i => i.status === "BLOCKED").length} محظورة`),
      tile("فرضيات مختبرة (إجمالي)", N(int(R.lifetime_tests)), `الصدفة المتوقعة بلا تصحيح ≈ ${int(Math.round(R.lifetime_tests * .05))}`)));

  // funnel: from everything tested to what reached paper-trading readiness
  const steps = [
    ["فرضيات وتوليفات مختبرة", R.lifetime_tests + (run?.meta?.total_combos || 0)],
    ["دلالة إحصائية بعد التصحيح", R.runs.reduce((a, r) => a + (r.bh_significant || 0), 0) + passed.length],
    ["مرشّحة بعد التكاليف والثبات", R.runs.reduce((a, r) => a + (r.candidates || 0), 0)],
    ["اجتازت الخزنة المقفلة", vpass],
    ["جاهزة لـ Paper trading (بموافقتك)", R.promoted.length],
  ];
  const fmax = Math.max(1, ...steps.map(x => x[1]));
  const funnel = card("قمع التصفية", "كل مرحلة تُسقط ما قد يكون صدفة. الأرقام تراكمية.",
    h("div", { class: "funnel" }, steps.map(([l, v], i) => h("div", { class: "frow" },
      h("span", {}, l), h("div", { class: "fbar", style: `width:${Math.max(.6, Math.sqrt(v / fmax) * 100)}%;background:var(${["--d-p1", "--d-p1", "--d-p2", "--d-p2", "--d-p3"][i]})` }),
      h("span", { class: "fv" }, int(v))))),
    h("p", { class: "sub", style: "margin-top:10px" }, "طول الشريط بمقياس الجذر التربيعي ليظهر الصغير بجانب الكبير."));

  const lb = card("ترتيب الاستراتيجيات", "مرتبة بعدد الأزواج التي اجتازتها ثم وسيط Sharpe. اضغط للتفاصيل.",
    h("div", { class: "lb" }, (run?.leaderboard || []).map(l => h("button", { class: "lb-row", onclick: () => { S.tab = "lab"; S.family = "all"; S.sel = pickBest(l.strategy); render(); } },
      h("div", {}, h("div", { class: "nm" }, stratName(l.strategy)), h("div", { class: "fam" }, FAMILY[l.family] || l.family || "")),
      h("span", { class: "passdots", "aria-label": `${l.passed} من ${l.pairs}` }, Array.from({ length: l.pairs }, (_, i) => h("i", { class: i < l.passed ? "on" : "" }))),
      h("span", { class: "mt", style: "font-size:12px;color:var(--ink-2)" }, "وسيط Sharpe ", N(num(l.median_wf_sharpe))),

function pickBest(strategy) {
  const rs = currentRun().rows.filter(r => r.strategy === strategy);
  const b = rs.sort((a, b) => (b.score ?? -1) - (a.score ?? -1))[0];
  return b ? `${b.strategy}|${b.pair}` : null;
}

async function apiList() {
  try {
    const r = await fetch("api/submissions", { cache: "no-store" });

    const j = await r.json(); U.api = true; U.items = j.items; U.llm = j.llm; U.quota = [j.used_today, j.daily_limit];
  } catch (e) { U.api = false; U.items = D.submissions || []; }
  schedulePoll();
}
function schedulePoll() {
  clearTimeout(U.timer);
  const pending = (U.items || []).some(x => !["done", ...Object.keys(BAD)].includes(x.state));
  if (U.api && pending) U.timer = setTimeout(async () => { await apiList(); if (S.tab === "upload" && !document.activeElement?.closest?.("form")) render(); }, 4000);
}
async function submitUpload(form) {
  if (!U.file || U.busy) return;
  U.busy = true; U.msg = null; render();
  const fd = new FormData();
  fd.append("file", U.file);
  ["source", "url", "claim", "license"].forEach(k => fd.append(k, form.querySelector("#up-" + k).value.trim()));
  try {
    const r = await fetch("api/submissions", { method: "POST", body: fd, headers: { "X-Lab-Request": "1" } });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || ("HTTP " + r.status));
    U.file = null; U.form = { source: "other", url: "", claim: "", license: "" }; U.msg = ["ok", "تم الاستلام. يبدأ التحليل الآن، وتتحدث الحالة هنا تلقائيًا."];
  } catch (e) { U.msg = ["err", "لم يُرفع الملف: " + e.message]; }
  U.busy = false;
  await apiList(); render();
}

function stepper(st) {
  const bad = BAD[st.state];
  const reached = new Set((st.timeline || []).map(t => t.state));
  const curIdx = STAGE.findIndex(([k]) => k === st.state);
  return h("ol", { class: "steps", "aria-label": "مراحل المعالجة" }, STAGE.map(([k, l], i) => {
    let cls = reached.has(k) ? "done" : "";
    if (k === st.state && k !== "done") cls = "now";
    if (k === "done" && st.state === "done") cls = "done";
    return h("li", { class: cls }, h("i"), l);
  }), bad ? h("li", { class: "bad" }, h("i"), bad) : null);
}

      table([{ label: "الزوج", get: r => N(r.pair) }, { label: "الحكم", get: r => pill(r.verdict) }, { label: "Sharpe WF", n: 1, get: r => num(r.wf_sharpe) },

      st.state === "done" ? h("p", { class: "sub" }, "ستظهر التفاصيل الكاملة في تبويب الاستراتيجيات بعد التحديث التالي للوحة (خلال 15 دقيقة).") : null);

  if (U.items === null) { apiList().then(() => S.tab === "upload" && render()); return [h("div", { class: "empty" }, "جارٍ التحقق من خدمة الرفع…")]; }

      h("label", { class: "field", for: "up-license" }, "الترخيص (اختياري)", h("input", { id: "up-license", maxlength: 80, placeholder: "MIT، MPL-2.0 …", dir: "ltr", ...keep("license") }))),

    h("div", { class: "route" }, h("b", {}, "PDF · Word · نص · Pine · MQL · Excel حر"), h("span", { class: "ext" }, ".pdf .docx .txt .pine .mq4 .mq5 .csv"), "يقرأ Claude الملف ويستخرج القواعد إلى مواصفة منظّمة، ويذكر كل افتراض اتخذه. لا يُكتب أي كود قابل للتنفيذ."),

/* ---------------------------------------------------------------- render */
function render() {
  const app = $("#app");
  try { localStorage.setItem("lab.tab", S.tab); } catch (e) {}
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)));
  const views = { overview: viewOverview, lab: viewLab, upload: viewUpload, research: viewResearch, imports: viewImports, data: viewData };
  const kids = [];
  if (D.sample) kids.push(h("div", { class: "sample" }, "بيانات تجريبية مولّدة لعرض التصميم، وليست نتائج أسواق حقيقية. تُستبدل تلقائيًا بعد أول تشغيل على السيرفر."));
  kids.push(...(views[S.tab] || viewOverview)().filter(Boolean));
  app.replaceChildren(...kids);
  hideTip();
}

function boot(data) {
  D = data;
  S.run = D.lab.latest;
  const sel = $("#runSel");
  sel.replaceChildren(...D.lab.runs.map(r => {
    const strategies = r.leaderboard.length;
    const label = `${fmtDT(r.meta.generated ? r.meta.generated.replace(" UTC", "Z").replace(" ", "T") : null)} · ${r.meta.tf || ""} · ${strategies === 1 ? "استيراد: " + stratName(r.leaderboard[0].strategy) : strategies + " استراتيجيات"}${r.meta.spread_mult && r.meta.spread_mult !== 1 ? " · spread ×" + r.meta.spread_mult : ""}`;
    return h("option", { value: r.id, selected: r.id === S.run ? true : null }, label);
  }));
  if (!D.lab.runs.length) sel.append(h("option", {}, "لا توجد تشغيلات"));
  sel.onchange = () => { S.run = sel.value; S.sel = null; render(); };
  const last = D.pipeline.pairs.map(p => p.last).filter(Boolean).sort().at(-1);
  const age = last ? (new Date(D.generated) - new Date(last)) / 36e5 : null;
  const f = $("#fresh");
  f.replaceChildren(h("i", { class: "dot", style: `background:${age == null ? "var(--muted)" : age <= 72 ? "var(--good)" : age <= 168 ? "var(--warn)" : "var(--crit)"}` }),
    h("span", {}, "آخر شمعة ", N(fmtDT(last))));
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; render(); });
  render();
}

(window.__LAB_DATA__ ? Promise.resolve(window.__LAB_DATA__) : fetch("data.json", { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }))
  .then(boot)
  .catch(err => $("#app").replaceChildren(h("div", { class: "empty" }, "تعذّر تحميل data.json (", String(err.message || err), "). شغّل build_dashboard.py على السيرفر ثم حدّث الصفحة.")));
</script>
