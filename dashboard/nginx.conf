server {
    listen 80;
    server_name _;
    root /data/dashboard;
    index index.html;

    # password protection — credentials generated at container start (entrypoint.sh)
    auth_basic "Strategy Lab";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # private research tool: never indexed, never framed elsewhere
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    # only the two dashboard files are served — nothing else on the volume
    location = / { try_files /index.html =404; }
    # (no add_header inside locations: nginx would drop the server-level security headers)
    location = /index.html { expires -1; }
    location = /data.json  { expires -1; }
    location = /healthz    { auth_basic off; access_log off; return 200 "ok"; }
    location / { return 404; }

    gzip on;
    gzip_types application/json text/html;
    gzip_min_length 1024;
}
